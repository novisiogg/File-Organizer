[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "file-organizer"
version = "1.0.0"
description = "Organize files by extension into categorized folders"
readme = "README.md"
authors = [{name = "novisiogg", email = "novisiovfx@gmail.com"}]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []
requires-python = ">=3.12"

[project.scripts]
organize = "organizer.__main__:main"

[tool.setuptools.package-data]
organizer = ["config/*.json"]